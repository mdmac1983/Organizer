name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore organizer-release.jks \
            -alias organizer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ChangeThisPassword123" \
            -keypass "ChangeThisPassword123" \
            -dname "CN=Organizer, OU=Personal, O=mdmac1983, L=Unknown, S=Unknown, C=US"

      - name: Base64 encode keystore
        run: base64 organizer-release.jks > organizer-release.jks.b64

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            organizer-release.jks
            organizer-release.jks.b64
